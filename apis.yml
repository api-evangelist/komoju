  - Sessions
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://doc.komoju.com/reference/sessions
  baseURL: https://komoju.com/api/v1
  properties:
  - url: https://doc.komoju.com/docs/hosted-page-integration-guide
    type: Documentation
  - url: https://doc.komoju.com/reference/sessions
    type: APIReference
  - url: openapi/komoju-openapi.yml
    type: OpenAPI
  description: Hosted checkout sessions that collect payment or customer details on a
    KOMOJU-hosted page. Create, show, cancel, and pay for sessions in payment, customer,
    or customer_payment mode.
