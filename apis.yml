aid: komoju
url: https://raw.githubusercontent.com/api-evangelist/komoju/refs/heads/main/apis.yml
name: KOMOJU
kind: company
description: KOMOJU is a Japan-focused global payment gateway operated by Degica. Its
  REST API lets web and e-commerce merchants accept a wide range of local and international
  payment methods through one interface - credit cards, convenience store (konbini)
  cash payments, bank transfer, Pay-easy (ATM), and e-money / mobile wallets such as
  PayPay, Merpay, au PAY, Rakuten Pay, LINE Pay, Alipay, and WeChat Pay - plus a hosted
  checkout (Sessions), tokenization, saved customers, subscriptions, and webhook events.
  Base URL is https://komoju.com/api/v1 with HTTP Basic authentication using a secret
  or publishable API key.
image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
tags:
- Payments
- Payment Gateway
- Japan
- Konbini
- Cards
- PayPay
- Bank Transfer
- E-Money
- Checkout
- Fintech
created: '2026-07-12'
modified: '2026-07-12'
