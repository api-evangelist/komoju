  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://doc.komoju.com/reference/subscriptions
  baseURL: https://komoju.com/api/v1
  properties:
  - url: https://doc.komoju.com/reference/subscriptions
    type: APIReference
  - url: openapi/komoju-openapi.yml
    type: OpenAPI
  description: Recurring payments charged against a saved customer on a weekly, monthly,
    or yearly period. Create, show, list, and delete subscriptions; subscriptions are
    immutable once created.
- aid: komoju:komoju-payment-methods-api
  name: KOMOJU Payment Methods API
  tags:
  - Payment Methods
  - Konbini
  - E-Money
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://doc.komoju.com/reference/listpaymentmethods
  baseURL: https://komoju.com/api/v1
  properties:
  - url: https://doc.komoju.com/supported-payment-methods
    type: Documentation
  - url: https://doc.komoju.com/reference/listpaymentmethods
    type: APIReference
  - url: openapi/komoju-openapi.yml
    type: OpenAPI
  description: Lists the payment methods available to the authenticated merchant for a
    given amount and currency - credit_card, konbini, bank_transfer, pay_easy, paypay,
    merpay, au_pay, rakutenpay, linepay, alipay, wechatpay, and paidy - plus konbini
    barcode retrieval for compatible payments.
- aid: komoju:komoju-events-api
  name: KOMOJU Events API
  tags:
  - Webhooks
  - Events
  - Notifications
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://doc.komoju.com/reference/listevents
  baseURL: https://komoju.com/api/v1
  properties:
