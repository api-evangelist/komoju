  description: Create, capture, refund, cancel, update, and list payments across cards,
    konbini, bank transfer, Pay-easy, and e-money wallets. Supports two-step capture
    (authorize then capture) and manual refund requests for non-refundable methods
    like konbini.
- aid: komoju:komoju-sessions-api
  name: KOMOJU Sessions API
  tags:
