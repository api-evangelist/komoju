    type: Documentation
  - url: https://doc.komoju.com/reference/listevents
    type: APIReference
  - url: openapi/komoju-openapi.yml
    type: OpenAPI
  description: Query the webhook events KOMOJU emits (payment.authorized, payment.captured,
    payment.refunded, payment.failed, payment.marked.as.fraud, and more). Webhooks are
    delivered as signed HTTP POSTs verified via an X-Komoju-Signature HMAC header.
