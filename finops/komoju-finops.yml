description: >-
  FinOps view of KOMOJU spend. KOMOJU is a payment gateway, so cost is not a
  subscription or compute bill but a per-transaction processing fee deducted
  from settlements. There are no sign-up or monthly fees; each successful
  payment incurs a percentage fee that varies by payment method and region
  (for Japan: credit cards ~3.25%, konbini ~2.75%, bank transfer ~1.4%,
  Pay-easy ~2.75%, PayPay and similar wallets from ~3.5%, Rakuten Pay from
  ~4.4%, Paidy from ~3.5%). Because fees differ sharply by method, the payment
  method mix is the dominant cost driver, and net settlement equals gross
  volume minus method fees, refunds, and chargebacks.
notes: >-
  Per-transaction rates are indicative Japan-region published rates and are not
  reconciled against a specific merchant agreement. Verify current rates on
  en.komoju.com/pricing. Refunds, refund requests (for konbini and similar),
  and chargebacks affect net settlement and should be tracked as cost/adjustment
  categories.
