meters:
- name: transaction_fee
  description: Per-transaction processing fee, charged as a percentage of the payment amount and varying by payment method.
  unit: percent_of_amount
  aggregation: sum
  dimensions:
  - payment_method
  - currency
  - region
- name: refund_adjustment
  description: Refunds and manual refund requests that reduce net settlement.
  unit: amount
  aggregation: sum
  dimensions:
  - payment_method
  - currency
- name: chargeback_adjustment
  description: Chargebacks and disputes that reduce net settlement (for merchants with the chargeback feature).
  unit: amount
  aggregation: sum
  dimensions:
  - payment_method
  - currency
principles:
- name: Visibility
  description: Track fees by payment method and currency via the Settlements and Balance endpoints; net settlement equals gross volume minus method fees, refunds, and chargebacks.
- name: Allocation
  description: Use external_order_num and metadata on payments to map processing fees back to products, channels, or business units.
- name: Optimization
  description: Steer customers toward lower-fee methods where practical (bank transfer ~1.4% vs card ~3.25% vs prepaid wallets much higher), and reduce chargebacks with 3D Secure and stored-credential compliance.
- name: Accountability
  description: Reconcile monthly settlements, review the payment-method mix against fee rates, and monitor refund/chargeback rates per method.
