    - POST   https://komoju.com/api/v1/payments/{id}/cancel
    - POST   https://komoju.com/api/v1/payments/{id}/refund_request
    - POST   https://komoju.com/api/v1/sessions
    - GET    https://komoju.com/api/v1/sessions/{id}
    - POST   https://komoju.com/api/v1/sessions/{id}/cancel
    - POST   https://komoju.com/api/v1/sessions/{id}/pay
    - POST   https://komoju.com/api/v1/tokens
    - POST   https://komoju.com/api/v1/secure_tokens
    - GET    https://komoju.com/api/v1/secure_tokens/{id}
    - POST   https://komoju.com/api/v1/customers
    - GET    https://komoju.com/api/v1/customers
    - GET    https://komoju.com/api/v1/customers/{id}
    - PATCH  https://komoju.com/api/v1/customers/{id}
    - DELETE https://komoju.com/api/v1/customers/{id}
    - POST   https://komoju.com/api/v1/subscriptions
    - GET    https://komoju.com/api/v1/subscriptions
    - GET    https://komoju.com/api/v1/subscriptions/{id}
    - DELETE https://komoju.com/api/v1/subscriptions/{id}
