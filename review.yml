    - GET    https://komoju.com/api/v1/events/{id}
    - GET    https://komoju.com/api/v1/barcodes/{payment_id}
  endpointsModeled:
    note: |
      All endpoints listed under endpointsConfirmedRest were confirmed against
      the public KOMOJU API reference (doc.komoju.com), including exact paths
      and HTTP methods. The request/response SCHEMAS in
      openapi/komoju-openapi.yml are a representative, partly modeled subset -
      object field lists are simplified and some objects use
      additionalProperties where the full attribute set is extensive. The
      captured endpoint subset omits the KOMOJU Platform Model / sub-merchant,
      settlement, balance, file, live-application, chargeback, and cloud
      terminal endpoints, which are documented but out of scope for this
      representative catalog entry.
  supportedPaymentMethods:
    - credit_card
    - konbini
    - bank_transfer
    - pay_easy
    - paypay
    - merpay
    - au_pay
    - rakutenpay
    - linepay
    - alipay
    - wechatpay
    - paidy
sources:
  - url: https://doc.komoju.com/
    type: Documentation
    note: KOMOJU documentation home; llms.txt indexes all guides and the OpenAPI-backed API reference.
  - url: https://doc.komoju.com/docs/authentication
    type: Documentation
    note: HTTP Basic auth, API key as username with empty password; secret vs publishable keys; test/live pairs.
  - url: https://doc.komoju.com/reference/payments
    type: APIReference
    note: Payment create/list/show/update/capture/refund/cancel/refund_request under /payments. All REST. No WebSocket.
  - url: https://doc.komoju.com/reference/sessions
    type: APIReference
    note: Hosted checkout sessions create/show/cancel/pay under /sessions.
  - url: https://doc.komoju.com/reference/tokens
    type: APIReference
    note: Token and secure token (3DS) creation under /tokens and /secure_tokens.
  - url: https://doc.komoju.com/reference/createcustomer
    type: APIReference
    note: Customer CRUD under /customers.
  - url: https://doc.komoju.com/reference/listevents
    type: APIReference
    note: Webhook events list/show under /events.
  - url: https://doc.komoju.com/docs/webhooks
    type: Documentation
    note: Outbound webhooks with X-Komoju-Signature SHA-2 HMAC verification. Server-to-endpoint HTTP POST, not WebSocket.
actions:
  asyncapiPath: null
  apisYmlUpdated: true
  reason: |
    No WebSocket protocol surface exists on KOMOJU's own API. The public API is
    request/response REST (https://komoju.com/api/v1) plus outbound signed HTTP
    webhooks. No AsyncAPI document was created because there is no server-push
    transport (WebSocket or SSE) on KOMOJU's own host to model - asynchronous
    delivery happens via webhook callbacks to merchant-hosted endpoints.
