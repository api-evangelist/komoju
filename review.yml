aid: komoju
name: KOMOJU
review:
  question: Does KOMOJU expose a documented public WebSocket API?
  answer: false
  date: '2026-07-12'
  reviewer: API Evangelist
  asyncapiSpecCreated: false
  asyncapiScopeNote: |
    No AsyncAPI document was authored. KOMOJU's public API surface
    (https://komoju.com/api/v1) is request/response REST over HTTPS. Its
    asynchronous, event-driven behavior is delivered via outbound webhooks -
    KOMOJU POSTs signed event payloads (X-Komoju-Signature HMAC) to a
    merchant-configured HTTPS endpoint - not via a server-push transport
    (WebSocket or SSE) on KOMOJU's own API. Because there is no WebSocket or
    SSE surface to model, and current API Evangelist scope treats plain HTTP
    webhook callbacks as REST-adjacent rather than an AsyncAPI channel on the
    provider's own host, no AsyncAPI spec was created.
findings:
  summary: |
    KOMOJU does not publish a documented public WebSocket API. KOMOJU is a
    Japan-focused payment gateway operated by Degica. Its API is a
    request/response REST API over HTTPS with base URL
    https://komoju.com/api/v1, authenticated with HTTP Basic (API key as
    username, empty password). Asynchronous payment-state changes (for konbini,
    bank transfer, PayPay, and other delayed methods) are communicated to
    merchants through outbound webhooks - signed HTTP POSTs to a
    merchant-configured URL - and can also be polled via the Sessions Show and
    Events endpoints. No realtime, bidirectional, or streaming WebSocket
    (ws:// or wss://) endpoint is documented anywhere in KOMOJU's API
    reference as of the review date.
  accessModel: |
    Commercial gateway requiring a merchant account. Each account has separate
    test and live key pairs, each with a secret key (full access, server-side)
    and a publishable key (limited to Create Token and Pay Session, safe
    client-side). Authentication is HTTP Basic with the key as username and an
    empty password.
  transports:
    - protocol: REST
      scheme: https
      baseURL: https://komoju.com/api/v1
      documented: true
      note: All payment, session, token, customer, subscription, payment-method, and event endpoints are HTTPS REST.
    - protocol: Webhook
      scheme: https
      documented: true
      note: KOMOJU POSTs signed event payloads (X-Komoju-Signature HMAC) to a merchant-configured HTTPS endpoint. Server-to-endpoint HTTP, not WebSocket.
    - protocol: WebSocket
      scheme: wss
      documented: false
      note: No WebSocket endpoint is documented anywhere in KOMOJU's API reference as of the review date.
